# =======================================================
# --- Server & Application Configuration ---
# =======================================================
server.port=8080
spring.application.name=Digirobe

# =======================================================
# --- PostgreSQL Database Configuration ---
# =======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/digirobe
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# =======================================================
# --- JPA / Hibernate Configuration ---
# =======================================================
# Use the correct dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# This will update the database schema if your @Entity classes change
spring.jpa.hibernate.ddl-auto=update

# This will show the SQL queries in the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =======================================================
# --- JWT Security Configuration ---
# =======================================================
# A securely generated, Base64-encoded secret key for signing tokens.
jwt.secret=SomethingVerySecureAndLongEnoughToBeAGoodSecretKeyForHS256

